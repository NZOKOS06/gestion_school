# Configuration Render — API backend (DB externe : Neon Postgres)
# https://render.com/docs/render-yaml-spec
#
# Neon : créer le projet sur console.neon.tech, copier les URLs pooled + direct.
# Vercel : déployer client/ avec VITE_API_URL → URL Render de ce service.

services:
  - type: web
    name: gestschool-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      # Neon — DATABASE_URL (pooled pour l’API ; URL directe recommandée pour migrate)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # URL Vercel (ex. https://gestschool.vercel.app) — CORS + cookies
      - key: FRONTEND_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optionnel — Render Redis ou Upstash ; sans REDIS_URL → cache mémoire
      - key: REDIS_URL
        sync: false
      - key: DOMAIN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      # Laisser false : le boot seed automatiquement SI la base est vide (bootstrap-if-empty)
      - key: RUN_SEED
        value: "false"
      - key: ALLOW_PROD_SEED
        value: "false"
      # Obligatoires pour le 1er boot (base vide) — password ≥12, ≠ SuperAdmin123!
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
