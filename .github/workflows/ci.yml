name: GestPharma CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Tests unitaires et intégration ──────────────────
  test-backend:
    name: Tests Backend (Vitest + Supertest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestpharma_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Setup environment
        working-directory: server
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/gestpharma_test
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/gestpharma_test
          JWT_SECRET=ci-test-secret-not-for-production-use
          JWT_REFRESH_SECRET=ci-refresh-secret-different
          PORT=3001
          NODE_ENV=test
          SUPER_ADMIN_EMAIL=superadmin@gestpharma.com
          SUPER_ADMIN_PASSWORD=SuperAdmin123!
          EOF

      - name: Run Prisma migrations
        working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestpharma_test

      - name: Run unit tests
        working-directory: server
        run: npx vitest run --reporter=verbose
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gestpharma_test
          JWT_SECRET: ci-test-secret-not-for-production-use
          JWT_REFRESH_SECRET: ci-refresh-secret-different

      - name: Run integration tests
        working-directory: server
        run: npm run test:integration
        env:
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gestpharma_test
          JWT_SECRET: ci-test-secret-not-for-production-use
          JWT_REFRESH_SECRET: ci-refresh-secret-different

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/

  # ── Build frontend ───────────────────────────────────
  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Create env file
        working-directory: client
        run: |
          cat > .env << 'EOF'
          VITE_API_URL=http://localhost:3001
          VITE_DEFAULT_TENANT=demo
          VITE_SUBDOMAIN_MODE=false
          VITE_SOCKET_URL=http://localhost:3001
          EOF

      - name: Build
        working-directory: client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/

  # ── Tests E2E Playwright ─────────────────────────────
  test-e2e:
    name: Tests E2E Playwright
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestpharma_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install all dependencies
        run: |
          cd server && npm ci
          cd ../client && npm ci
          cd .. && npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup DB + seed
        working-directory: server
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/gestpharma_e2e
          JWT_SECRET=e2e-test-secret-gestpharma
          JWT_REFRESH_SECRET=e2e-refresh-secret-gestpharma
          PORT=3000
          NODE_ENV=development
          SUPER_ADMIN_EMAIL=superadmin@gestpharma.com
          SUPER_ADMIN_PASSWORD=SuperAdmin123!
          EOF
          npx prisma migrate deploy
          node prisma/seed.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestpharma_e2e

      - name: Setup frontend env
        working-directory: client
        run: |
          cat > .env << 'EOF'
          VITE_API_URL=http://localhost:3000
          VITE_DEFAULT_TENANT=demo
          VITE_SUBDOMAIN_MODE=false
          VITE_SOCKET_URL=http://localhost:3000
          EOF

      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/reports/

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

  # ── Notification résultat ────────────────────────────
  notify:
    name: Résultat CI
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, test-e2e]
    if: always()

    steps:
      - name: Statut final
        run: |
          if [ "${{ needs.test-backend.result }}" = "success" ] &&
             [ "${{ needs.build-frontend.result }}" = "success" ] &&
             [ "${{ needs.test-e2e.result }}" = "success" ]; then
            echo "✅ Tous les tests passent — GestPharma prêt pour le déploiement"
          else
            echo "❌ Des tests ont échoué — voir les artifacts pour les détails"
            exit 1
          fi
