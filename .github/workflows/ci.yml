name: GestSchool CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Tests unitaires ─────────────────────────────────
  test-backend:
    name: Tests Backend (Vitest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestschool_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Setup environment
        working-directory: server
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/gestschool_test
          DATABASE_URL_TEST=postgresql://postgres:postgres@localhost:5432/gestschool_test
          JWT_SECRET=ci-test-secret-not-for-production-use
          JWT_REFRESH_SECRET=ci-refresh-secret-different
          PORT=3001
          NODE_ENV=test
          SUPER_ADMIN_EMAIL=superadmin@gestschool.com
          SUPER_ADMIN_PASSWORD=SuperAdmin123!
          EOF

      - name: Run Prisma migrations
        working-directory: server
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestschool_test

      - name: Run unit tests
        working-directory: server
        run: npx prisma generate && npx vitest run --reporter=verbose
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestschool_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gestschool_test
          JWT_SECRET: ci-test-secret-not-for-production-use
          JWT_REFRESH_SECRET: ci-refresh-secret-different

      - name: Run smoke integration
        working-directory: server
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestschool_test
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/gestschool_test
          JWT_SECRET: ci-test-secret-not-for-production-use
          JWT_REFRESH_SECRET: ci-refresh-secret-different

  # ── Build frontend ───────────────────────────────────
  build-frontend:
    name: Build Frontend (Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Create env file
        working-directory: client
        run: |
          cat > .env << 'EOF'
          VITE_API_URL=http://localhost:3001
          VITE_DEFAULT_TENANT=demo
          VITE_SUBDOMAIN_MODE=false
          VITE_SOCKET_URL=http://localhost:3001
          EOF

      - name: Build
        working-directory: client
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: client/dist/

  # ── E2E smoke scolaire ───────────────────────────────
  test-e2e:
    name: Tests E2E Playwright (smoke)
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gestschool_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root (Playwright)
        run: npm ci

      - name: Install server
        working-directory: server
        run: npm ci

      - name: Install client
        working-directory: client
        run: npm ci

      - name: Server env
        working-directory: server
        run: |
          cat > .env << 'EOF'
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/gestschool_e2e
          JWT_SECRET=ci-e2e-secret-not-for-production-use
          JWT_REFRESH_SECRET=ci-e2e-refresh-secret-different
          PORT=3000
          NODE_ENV=development
          FRONTEND_URL=http://localhost:5175
          SUBDOMAIN_MODE=false
          SUPER_ADMIN_EMAIL=superadmin@gestschool.com
          SUPER_ADMIN_PASSWORD=SuperAdmin123!
          EOF

      - name: Client env
        working-directory: client
        run: |
          cat > .env << 'EOF'
          VITE_API_URL=http://localhost:3000
          VITE_DEFAULT_TENANT=demo
          VITE_SUBDOMAIN_MODE=false
          VITE_SOCKET_URL=http://localhost:3000
          EOF

      - name: Migrate + seed demo
        working-directory: server
        run: npx prisma migrate deploy && npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gestschool_e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/reports/
          retention-days: 7

  # ── Notification résultat ────────────────────────────
  notify:
    name: Résultat CI
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend, test-e2e]
    if: always()

    steps:
      - name: Statut final
        run: |
          if [ "${{ needs.test-backend.result }}" = "success" ] &&
             [ "${{ needs.build-frontend.result }}" = "success" ] &&
             [ "${{ needs.test-e2e.result }}" = "success" ]; then
            echo "✅ Backend + frontend + E2E smoke OK — GestSchool"
          else
            echo "❌ Des jobs ont échoué"
            exit 1
          fi
