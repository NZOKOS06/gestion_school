version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gestpharma-db
    environment:
      POSTGRES_USER: gestpharma
      POSTGRES_PASSWORD: gestpharma123
      POSTGRES_DB: gestpharma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestpharma -d gestpharma"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gestpharma-server
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gestpharma:gestpharma123@db:5432/gestpharma?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: gestpharma-client
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  server_uploads:
